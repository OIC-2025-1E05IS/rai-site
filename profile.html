<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自己紹介 </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- メニュー -->
  <header class="header">
    <nav class="nav">
      <ul>
        <li><a href="index.html">TOP</a></li>
        <li><a href="profile.html" class="current">自己紹介</a></li>
        <li><a href="gallery.html">フォトギャラリー</a></li>
      </ul>
    </nav>
  </header>

  <!-- メインビジュアル -->
  <div class="hero hero-small">
    <div class="inner">
      <div class="hero-text">
        <p class="hero-sub">自己紹介</p>
        <h1 class="hero-title">PROFILE</h1>
      </div>
    </div>
  </div>

  <main>
    <!-- プロフィール -->
    <section class="section">
      <div class="inner">
        <div class="pickup">
          <div class="pickup-photo">
            <img src="images/sleep.jpg" alt="ベッドで眠るライ">
          </div>
          <dl class="profile-list pickup-text">
            <div><dt>名前</dt><dd>ライ</dd></div>
            <div><dt>年齢</dt><dd>3歳</dd></div>
            <div><dt>性別</dt><dd>オス</dd></div>
            <div><dt>犬種</dt><dd>トイプードル</dd></div>
            <div><dt>好きなこと</dt><dd>日向ぼっこ、ボールキャッチ</dd></div>
          </dl>
        </div>
      </div>
    </section>
    <!-- 好きなこと -->
    <section class="section">
      <div class="inner">
        <h2 class="ribbon">好きなこと</h2>
        <div class="likes">
          <div class="like">
            <p class="like-icon">☀️</p>
            <h3>日向ぼっこ</h3>
            <p>お部屋の一番暖かいところによくいます。しばらく動きません。</p>
          </div>
          <div class="like">
            <p class="like-icon">🎾</p>
            <h3>ボールキャッチ</h3>
            <p>大きい公園でボールキャッチをすることが好きです。ボールをくわえると中々離しません</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="footer">
    <small>&copy; RAI'S ROOM</small>
  </footer>

</body>
</html>
